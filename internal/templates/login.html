{{ define "login" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Domain Minder</title>
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="container min-h-screen flex items-center justify-center">
        <div class="card container-small" style="max-width: 400px; margin: 0;">
            <div class="card-header">
                <h3>Login to Domain Minder</h3>
            </div>
            <div class="card-body">
                {{ if .Error }}
                <div class="alert alert-error" style="margin-bottom: 1rem;">
                    {{ .Error }}
                </div>
                {{ end }}
                <form method="POST" action="/login">
                    <input type="hidden" name="csrf" value="{{.csrf}}">
                    <input type="text" name="website_url" class="website-url-field" tabindex="-1" autocomplete="off">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-full">Login</button>
                </form>
                <div class="text-center mt-4">
                    <p style="font-size: 0.875rem; color: var(--text-muted);">
                        Don't have an account? <a href="/register">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
{{ end }}
