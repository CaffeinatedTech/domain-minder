{{ define "dashboard" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Domain Minder</title>
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Domain Minder</h1>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/domains">Domains</a>
                <a href="/settings">Settings</a>
                <form method="POST" action="/logout" style="display:inline;">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    <main class="container">
        <h2>Welcome, {{ .User.Email }}</h2>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value">{{ .TotalDomains }}</div>
                <div class="stat-label">Total Domains</div>
            </div>
            <div class="stat-card stat-warning">
                <div class="stat-value">{{ .ExpiringSoon }}</div>
                <div class="stat-label">Expiring Soon</div>
            </div>
            <div class="stat-card stat-danger">
                <div class="stat-value">{{ .Expired }}</div>
                <div class="stat-label">Expired</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3>Quick Actions</h3>
            </div>
            <div class="card-body">
                <a href="/domains/new" class="btn">Add New Domain</a>
                <a href="/domains" class="btn btn-secondary">View All Domains</a>
            </div>
        </div>
    </main>
</body>
</html>
{{ end }}
