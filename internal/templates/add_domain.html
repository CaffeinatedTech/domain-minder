{{ define "add_domain" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Domain - Domain Minder</title>
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>Domain Minder</h1>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/domains">Domains</a>
                <a href="/settings">Settings</a>
                <form method="POST" action="/logout" style="display:inline;">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    <main class="container-small">
        <div class="card">
            <div class="card-header">
                <h3>Add New Domain</h3>
            </div>
            <div class="card-body">
                <form method="POST" action="/domains">
                    <input type="hidden" name="csrf" value="{{.csrf}}">
                    <div class="form-group">
                        <label>Domain Name</label>
                        <input type="text" name="name" placeholder="example.com" required>
                    </div>
                    <div class="alert alert-info"
                        style="background: #eff6ff; border: 1px solid #dbeafe; padding: 0.75rem; border-radius: 0.375rem; display: flex; gap: 0.5rem; color: #1e40af; font-size: 0.875rem;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="16" x2="12" y2="12"></line>
                            <line x1="12" y1="8" x2="12.01" y2="8"></line>
                        </svg>
                        <span>WHOIS lookup will be performed to find expiry date and registrar.</span>
                    </div>
                    <div style="margin-top: 1.5rem; display: flex; gap: 0.5rem;">
                        <button type="submit" class="btn btn-primary">Add Domain</button>
                        <a href="/domains" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
                <div id="result" style="margin-top: 1rem;"></div>
            </div>
        </div>
    </main>
</body>

</html>
{{ end }}
