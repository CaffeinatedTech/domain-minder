{{ define "edit_domain" }}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Domain - Domain Minder</title>
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Domain Minder</h1>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/domains">Domains</a>
                <a href="/settings">Settings</a>
                <form method="POST" action="/logout" style="display:inline;">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    <main class="container">
        <div class="card">
            <h2>Edit Domain</h2>
            <form method="POST" action="/domains/{{ .Domain.ID }}">
                <div class="form-group">
                    <label>Domain Name</label>
                    <input type="text" name="name" value="{{ .Domain.Name }}" required>
                </div>
                <div class="form-group">
                    <label>Registrar</label>
                    <input type="text" name="registrar" value="{{ nullString .Domain.Registrar }}">
                </div>
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="date" name="expiry_date" value="{{ formatDate .Domain.ExpiryDate }}" required>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="active"{{ if eq .Domain.Status "active" }} selected{{ end }}>Active</option>
                        <option value="expired"{{ if eq .Domain.Status "expired" }} selected{{ end }}>Expired</option>
                        <option value="pending"{{ if eq .Domain.Status "pending" }} selected{{ end }}>Pending</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea name="notes" rows="3">{{ nullString .Domain.Notes }}</textarea>
                </div>
                <button type="submit" class="btn">Save Changes</button>
                <a href="/domains" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </main>
</body>
</html>
{{ end }}
