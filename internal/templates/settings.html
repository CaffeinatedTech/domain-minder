{{ define "settings" }}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Domain Minder</title>
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>Domain Minder</h1>
            <nav>
                <a href="/dashboard">Dashboard</a>
                <a href="/domains">Domains</a>
                <a href="/settings">Settings</a>
                <form method="POST" action="/logout" style="display:inline;">
                    <button type="submit">Logout</button>
                </form>
            </nav>
        </div>
    </header>
    <main class="container">
        <h2 style="margin-bottom: 2rem;">Settings</h2>

        <div class="stats-grid">
            <div class="card">
                <div class="card-header">
                    <h3>Profile</h3>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" value="{{ .User.Email }}" disabled
                            style="background-color: #f8fafc; cursor: not-allowed;">
                    </div>
                    <div class="form-group">
                        <label>Email Verified</label>
                        <div
                            style="display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.375rem;">
                            {{ if .User.EmailVerified }}
                            <span style="color: #10b981;">&#10003; Verified</span>
                            {{ else }}
                            <span style="color: #64748b;">Not Verified</span>
                            {{ end }}
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Notifications</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="/settings/notifications">
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" name="notification_email" {{ if .User.NotificationEmail
                                    }}checked{{ end }} style="width: auto;">
                                Email Notifications
                            </label>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                                <input type="checkbox" name="notification_telegram" {{ if .User.NotificationTelegram
                                    }}checked{{ end }} style="width: auto;">
                                Telegram Notifications
                            </label>
                        </div>
                        <div class="form-group">
                            <label>Telegram Chat ID</label>
                            <input type="text" name="telegram_chat_id" value="{{ .TelegramChatID }}"
                                placeholder="Your Telegram Chat ID">
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Notifications</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h3>Alert Thresholds</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="/settings/thresholds">
                        <div class="form-group">
                            <label>Days before expiry to alert</label>
                            <input type="text" name="thresholds" value="{{ .User.NotificationThresholds }}"
                                placeholder="90, 60, 30, 14, 7, 3, 1">
                            <small>Comma-separated list of days</small>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Save Thresholds</button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
{{ end }}
